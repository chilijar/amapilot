name: Bug 报告
description: 提交一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整——车机相关 bug 离开环境信息几乎无法定位。
        日志与截图请先脱敏（位置、账号、车牌等）。
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: app 版本、手机型号与 Android 版本、Android Auto 版本、车机车型（是否经 Play 安装）
      placeholder: |
        Amapilot 版本：
        手机：如 Pixel 8 / Android 15
        Android Auto：如 18.x
        车机车型：如 xxx（侧载 / Play 内测版）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: adb logcat 相关片段（脱敏后粘贴）
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: 截图/录屏
      description: 涉及 UI 时附上（脱敏）
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我使用的是最新构建（main 或最新 Release）
          required: true
        - label: 日志/截图中不含个人位置、账号等敏感信息
          required: true
